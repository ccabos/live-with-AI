<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

<style>
  :root {
    color-scheme: light;
    --ground:   #EAEDEC;
    --surface:  #F7F8F7;
    --sunken:   #E1E5E4;
    --ink:      #141A18;
    --ink-2:    #38423F;
    --muted:    #7C8683;
    --rule:     #C9CFCD;
    --hairline: #D8DDDB;
    --steel:    #0086A8;
    --ember:    #D2551F;

    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:   #141918;
      --surface:  #1C2322;
      --sunken:   #101514;
      --ink:      #EDF0EE;
      --ink-2:    #C2CBC8;
      --muted:    #7E8886;
      --rule:     #333D3B;
      --hairline: #2A3433;
      --steel:    #1B9DB7;
      --ember:    #DE6630;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:   #141918;
    --surface:  #1C2322;
    --sunken:   #101514;
    --ink:      #EDF0EE;
    --ink-2:    #C2CBC8;
    --muted:    #7E8886;
    --rule:     #333D3B;
    --hairline: #2A3433;
    --steel:    #1B9DB7;
    --ember:    #DE6630;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink-2);
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.66;
    margin: 0;
    padding: 0 20px 96px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; }

  /* masthead */
  .top {
    max-width: 680px;
    margin: 0 auto;
    padding: 26px 0 22px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 48px;
  }
  .top a {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
  }
  .top a:hover { color: var(--ember); }
  .top a:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }

  /* headings */
  h1, h2, h3, h4 { color: var(--ink); text-wrap: balance; font-weight: 400; }
  h1 {
    font-size: clamp(32px, 5vw, 46px);
    line-height: 1.1;
    letter-spacing: -0.015em;
    margin: 0 0 34px;
  }
  h2 {
    font-size: clamp(23px, 3vw, 29px);
    line-height: 1.22;
    letter-spacing: -0.01em;
    margin: 58px 0 18px;
    padding-top: 22px;
    border-top: 1px solid var(--hairline);
  }
  h3 {
    font-size: 20px;
    line-height: 1.3;
    margin: 38px 0 14px;
  }
  h4 {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 32px 0 12px;
  }

  p { margin: 0 0 22px; }
  em { font-style: italic; }
  strong { color: var(--ink); font-weight: 600; }

  a { color: var(--ink); text-decoration-color: var(--rule); text-underline-offset: 3px; }
  a:hover { color: var(--ember); text-decoration-color: var(--ember); }
  a:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

  ul, ol { margin: 0 0 22px; padding-left: 1.4em; }
  li { margin-bottom: 10px; }
  li::marker { color: var(--muted); }
  ul ul, ol ol, ul ol, ol ul { margin: 10px 0 0; }

  blockquote {
    margin: 26px 0;
    padding: 4px 0 4px 24px;
    border-left: 2px solid var(--ember);
    color: var(--ink);
  }
  blockquote p:last-child { margin-bottom: 0; }

  hr {
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 52px 0;
  }

  code {
    font-family: var(--mono);
    font-size: 0.84em;
    background: var(--sunken);
    padding: 2px 6px;
    color: var(--ink);
  }
  pre {
    background: var(--surface);
    border: 1px solid var(--rule);
    padding: 18px 20px;
    overflow-x: auto;
    margin: 0 0 22px;
  }
  pre code { background: none; padding: 0; font-size: 13px; line-height: 1.6; }

  table {
    border-collapse: collapse;
    width: 100%;
    margin: 0 0 22px;
    font-family: var(--sans);
    font-size: 15px;
    display: block;
    overflow-x: auto;
  }
  th, td {
    text-align: left;
    padding: 9px 14px;
    border-bottom: 1px solid var(--hairline);
    vertical-align: top;
  }
  th { color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }

  /* mermaid */
  .mermaid {
    background: var(--surface);
    border: 1px solid var(--rule);
    padding: 22px 20px;
    margin: 0 0 22px;
    overflow-x: auto;
    text-align: center;
    font-family: var(--sans);
  }
  .mermaid svg { max-width: 100%; height: auto; }
  .mermaid[data-failed] {
    text-align: left;
    font-family: var(--mono);
    font-size: 13px;
    white-space: pre;
    color: var(--ink-2);
  }

  footer {
    max-width: 680px;
    margin: 72px auto 0;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule); }
  footer a:hover { color: var(--ember); border-color: var(--ember); }
</style>
</head>
<body>

<nav class="top"><a href="{{ '/' | relative_url }}">← {{ site.title }}</a></nav>

<main class="wrap">
  {{ content }}
</main>

<footer>
  <a href="https://github.com/ccabos/live-with-AI">github.com/ccabos/live-with-AI</a>
</footer>

<script type="module">
  // kramdown emits ```mermaid as <pre><code class="language-mermaid">.
  // Lift those into the <pre class="mermaid"> shape mermaid expects.
  const blocks = document.querySelectorAll('pre > code.language-mermaid');
  if (blocks.length) {
    blocks.forEach(function (code) {
      const pre = code.parentElement;
      const holder = document.createElement('pre');
      holder.className = 'mermaid';
      holder.textContent = code.textContent;
      pre.replaceWith(holder);
    });
    const dark = document.documentElement.dataset.theme === 'dark' ||
      (!document.documentElement.dataset.theme &&
        window.matchMedia('(prefers-color-scheme: dark)').matches);
    try {
      const { default: mermaid } =
        await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        theme: dark ? 'dark' : 'neutral',
        flowchart: { curve: 'basis', useMaxWidth: true }
      });
      await mermaid.run({ querySelector: '.mermaid' });
    } catch (e) {
      // Offline or CDN blocked: leave the diagram source readable rather than blank.
      document.querySelectorAll('.mermaid').forEach(function (el) {
        el.setAttribute('data-failed', '');
      });
    }
  }
</script>
</body>
</html>
